{% extends 'base.html' %}
{% load static %}

{% block title %}Cửa hàng - CleanAgri{% endblock %}

{% block content %}
<!-- Page Header -->
<div class="container-fluid page-header py-5">
    <h1 class="text-center text-white display-6">Sản phẩm</h1>
    <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="{% url 'home' %}">Trang chủ</a></li>
        <li class="breadcrumb-item active text-white">Sản phẩm</li>
    </ol>
</div>

<!-- Shop Start -->
<div class="container-fluid fruite py-5">
    <div class="container py-5">
        <h1 class="mb-4">Sản phẩm tươi sạch</h1>
        <div class="row g-4">
            <div class="col-lg-12">
                <div class="row g-4">
                    <div class="col-xl-3">
                        <div class="input-group w-100 mx-auto d-flex">
                            <input type="search" id="search-input" class="form-control p-3" placeholder="Tìm kiếm..." 
                                   onkeypress="if(event.key==='Enter') searchProducts()" aria-describedby="search-icon-1">
                            <span id="search-icon-1" class="input-group-text p-3" onclick="searchProducts()" style="cursor:pointer;">
                                <i class="fa fa-search"></i>
                            </span>
                        </div>
                    </div>
                    <div class="col-6"></div>
                    <div class="col-xl-3">
                        <div class="bg-light ps-3 py-3 rounded d-flex justify-content-between mb-4">
                            <label for="sort-select">Sắp xếp:</label>
                            <select id="sort-select" class="border-0 form-select-sm bg-light me-3" onchange="loadProducts()">
                                <option value="">Mặc định</option>
                                <option value="price_asc">Giá tăng dần</option>
                                <option value="price_desc">Giá giảm dần</option>
                                <option value="name">Tên A-Z</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row g-4">
                    <!-- Sidebar -->
                    <div class="col-lg-3">
                        <div class="row g-4">
                            <div class="col-lg-12">
                                <div class="mb-3">
                                    <h4>Danh mục</h4>
                                    <ul class="list-unstyled fruite-categorie" id="categories-list">
                                        <li>
                                            <div class="d-flex justify-content-between fruite-name">
                                                <a href="#" onclick="filterByCategory(null); return false;">
                                                    <i class="fas fa-apple-alt me-2"></i>Tất cả
                                                </a>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            
                            <div class="col-lg-12">
                                <div class="position-relative">
                                    <img src="{% static 'img/banner-fruits.jpg' %}" class="img-fluid w-100 rounded" alt="">
                                    <div class="position-absolute" style="top: 50%; right: 10px; transform: translateY(-50%);">
                                        <h3 class="text-secondary fw-bold">Nông sản <br> Tươi sạch <br> Banner</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Products Grid -->
                    <div class="col-lg-9">
                        <div class="row g-4 justify-content-center" id="products-grid">
                            <div class="col-12 text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Đang tải...</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Pagination -->
                        <div class="col-12">
                            <div class="pagination d-flex justify-content-center mt-5" id="pagination">
                                <!-- Pagination will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Shop End -->

<script>
let currentCategory = null;
let currentPage = 1;

// Load categories
fetch('/api/catalog/categories/')
    .then(res => res.json())
    .then(data => {
        const list = document.getElementById('categories-list');
        data.categories.forEach(cat => {
            list.innerHTML += `
                <li>
                    <div class="d-flex justify-content-between fruite-name">
                        <a href="#" onclick="filterByCategory(${cat.id}); return false;">
                            <i class="fas fa-apple-alt me-2"></i>${cat.name}
                        </a>
                        <span>(${cat.products_count})</span>
                    </div>
                </li>
            `;
        });
    });

// Load products
function loadProducts() {
    // LẤY SEARCH TỪ INPUT, KHÔNG PHẢI URL
    const search = document.getElementById('search-input').value.trim();
    const sort = document.getElementById('sort-select').value;
    
    let url = '/api/catalog/products/?';
    if (currentCategory) url += `category=${currentCategory}&`;
    if (search) url += `search=${encodeURIComponent(search)}&`;
    
    fetch(url)
        .then(res => res.json())
        .then(data => {
            let products = data.products;
            
            // Sort logic
            if (sort === 'price_asc') {
                products.sort((a, b) => a.price_vnd - b.price_vnd);
            } else if (sort === 'price_desc') {
                products.sort((a, b) => b.price_vnd - a.price_vnd);
            } else if (sort === 'name') {
                products.sort((a, b) => a.name.localeCompare(b.name));
            }
            
            displayProducts(products);
        })
        .catch(err => {
            console.error('Error:', err);
            document.getElementById('products-grid').innerHTML = 
                '<div class="col-12"><p class="text-center text-danger">Không thể tải sản phẩm</p></div>';
        });
}

// KHỞI TẠO KHI LOAD TRANG
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const searchParam = urlParams.get('search');
    if (searchParam) {
        document.getElementById('search-input').value = searchParam;
    }
    loadProducts();
});

function displayProducts(products) {
    const grid = document.getElementById('products-grid');
    
    if (products.length === 0) {
        grid.innerHTML = '<div class="col-12"><p class="text-center">Không tìm thấy sản phẩm nào</p></div>';
        return;
    }
    
    grid.innerHTML = products.map(product => `
        <div class="col-md-6 col-lg-6 col-xl-4">
            <div class="rounded position-relative fruite-item">
                <div class="fruite-img">
                    <img src="${product.thumbnail || '{% static "img/default-product.jpg" %}'}" 
                         class="img-fluid w-100 rounded-top" alt="${product.name}"
                         style="height: 200px; object-fit: cover;"
                         onerror="this.src='{% static \"img/default-product.jpg\" %}'">
                </div>
                <div class="text-white bg-secondary px-3 py-1 rounded position-absolute" style="top: 10px; left: 10px;">
                    ${product.category ? product.category.name : 'Sản phẩm'}
                </div>
                <div class="p-4 border border-secondary border-top-0 rounded-bottom">
                    <h4>${product.name}</h4>
                    <p>${product.description.substring(0, 80)}...</p>
                    <div class="d-flex justify-content-between align-items-center flex-wrap">
                        <p class="text-dark fs-5 fw-bold mb-2">${formatPrice(product.price_vnd)}</p>
                        <div class="d-flex gap-2">
                            <a href="/shop/detail/?id=${product.id}" class="btn border border-secondary rounded-pill px-3 text-primary">
                                <i class="fa fa-eye me-1 text-primary"></i> Xem
                            </a>
                            <a href="#" onclick="addToCart(${product.id}); return false;" class="btn border border-secondary rounded-pill px-3 text-primary">
                                <i class="fa fa-shopping-bag me-1 text-primary"></i> Thêm
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
}

function filterByCategory(categoryId) {
    currentCategory = categoryId;
    loadProducts();
}

function searchProducts() {
    // Chỉ cần gọi loadProducts, nó sẽ lấy value từ input
    loadProducts();
}

function formatPrice(price) {
    return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
}

function addToCart(productId) {
    const token = localStorage.getItem('token');
    
    if (!token) {
        if (confirm('Vui lòng đăng nhập để thêm sản phẩm vào giỏ hàng. Chuyển đến trang đăng nhập?')) {
            window.location.href = '/login/';
        }
        return;
    }
    
    fetch('/api/cart/add/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Token ' + token
        },
        body: JSON.stringify({
            product_id: productId,
            qty: 1
        })
    })
    .then(res => res.json())
    .then(data => {
        // CẬP NHẬT CART COUNT MÀ KHÔNG THÔNG BÁO
        updateCartCount();
        
        // Hiển thị badge nhỏ thay vì alert
        showMiniNotification('✓ Đã thêm vào giỏ hàng');
    })
    .catch(err => console.error('Error:', err));
}

// HÀM HIỂN THỊ THÔNG BÁO NHỎ
function showMiniNotification(message) {
    // Tạo element
    const notification = document.createElement('div');
    notification.style.cssText = `
        position: fixed;
        top: 100px;
        right: 20px;
        background: #28a745;
        color: white;
        padding: 15px 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        z-index: 9999;
        animation: slideIn 0.3s ease-out;
    `;
    notification.textContent = message;
    
    // Thêm vào body
    document.body.appendChild(notification);
    
    // Tự động xóa sau 2 giây
    setTimeout(() => {
        notification.style.animation = 'slideOut 0.3s ease-out';
        setTimeout(() => notification.remove(), 300);
    }, 2000);
}

// Thêm CSS animation
const style = document.createElement('style');
style.textContent = `
    @keyframes slideIn {
        from {
            transform: translateX(400px);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }
    @keyframes slideOut {
        from {
            transform: translateX(0);
            opacity: 1;
        }
        to {
            transform: translateX(400px);
            opacity: 0;
        }
    }
`;
document.head.appendChild(style);

function updateCartCount() {
    const token = localStorage.getItem('token');
    if (!token) return;
    
    fetch('/api/cart/me/', {
        headers: {'Authorization': 'Token ' + token}
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('cart-count').textContent = data.total_items || 0;
    });
}
</script>
{% endblock %}
