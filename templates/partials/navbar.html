{% load static %}
<!-- Navbar start -->
<div class="container-fluid fixed-top">
    <div class="container topbar bg-primary d-none d-lg-block">
        <div class="d-flex justify-content-between">
            <div class="top-info ps-2">
                <small class="me-3">
                    <i class="fas fa-map-marker-alt me-2 text-secondary"></i>
                    <a href="#" class="text-white">Việt Nam</a>
                </small>
                <small class="me-3">
                    <i class="fas fa-envelope me-2 text-secondary"></i>
                    <a href="#" class="text-white">cleanagri@example.com</a>
                </small>
            </div>
            <div class="top-link pe-2" id="top-auth-links">
                <a href="{% url 'login_page' %}" class="text-white">
                    <small class="text-white mx-2">Đăng nhập</small>/
                </a>
                <a href="{% url 'register_page' %}" class="text-white">
                    <small class="text-white ms-2">Đăng ký</small>
                </a>
            </div>
        </div>
    </div>
    
    <div class="container px-0">
        <nav class="navbar navbar-light bg-white navbar-expand-xl">
            <a href="{% url 'home' %}" class="navbar-brand">
                <h1 class="text-primary display-6">CleanAgri</h1>
            </a>
            <button class="navbar-toggler py-2 px-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="fa fa-bars text-primary"></span>
            </button>
            <div class="collapse navbar-collapse bg-white" id="navbarCollapse">
                <div class="navbar-nav mx-auto">
                    <a href="{% url 'home' %}" class="nav-item nav-link {% if request.path == '/' %}active{% endif %}">Trang chủ</a>
                    <a href="{% url 'shop' %}" class="nav-item nav-link {% if 'shop' in request.path %}active{% endif %}">Sản phẩm</a>
                    <a href="{% url 'contact' %}" class="nav-item nav-link">Liên hệ</a>
                </div>
                <div class="d-flex m-3 me-0">
                    <button class="btn-search btn border border-secondary btn-md-square rounded-circle bg-white me-4" data-bs-toggle="modal" data-bs-target="#searchModal">
                        <i class="fas fa-search text-primary"></i>
                    </button>
                    
                    <a href="{% url 'cart' %}" class="position-relative me-4 my-auto" id="cart-link" style="display:none;">
                        <i class="fa fa-shopping-bag fa-2x"></i>
                        <span id="cart-count" class="position-absolute bg-secondary rounded-circle d-flex align-items-center justify-content-center text-dark px-1" style="top: -5px; left: 15px; height: 20px; min-width: 20px;">0</span>
                    </a>
                    
                    <!-- User Dropdown -->
                    <div class="dropdown my-auto">
                        <a href="#" class="dropdown-toggle" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user fa-2x"></i>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown" id="user-menu">
                            <li><a class="dropdown-item" href="{% url 'login_page' %}">Đăng nhập</a></li>
                            <li><a class="dropdown-item" href="{% url 'register_page' %}">Đăng ký</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</div>
<!-- Navbar End -->

<!-- Modal Search Start -->
<div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content rounded-0">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Tìm kiếm sản phẩm</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body d-flex align-items-center">
                <div class="input-group w-75 mx-auto d-flex">
                    <input type="search" id="search-input" class="form-control p-3" placeholder="Nhập tên sản phẩm..." aria-describedby="search-icon-1">
                    <span id="search-icon-1" class="input-group-text p-3">
                        <i class="fa fa-search"></i>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Modal Search End -->

<script>
// Check authentication status and update navbar
function updateNavbar() {
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');
    
    if (token && userStr) {
        const user = JSON.parse(userStr);
        
        // Update top bar
        document.getElementById('top-auth-links').innerHTML = `
            <a href="#" class="text-white">
                <small class="text-white mx-2">Xin chào, ${user.username}</small>
            </a>
            <a href="#" onclick="logout()" class="text-white">
                <small class="text-white ms-2">Đăng xuất</small>
            </a>
        `;
        
        // Show cart link
        document.getElementById('cart-link').style.display = 'block';
        
        // Update user dropdown menu
        document.getElementById('user-menu').innerHTML = `
            <li><a class="dropdown-item" href="/profile/">
                <i class="fas fa-user me-2"></i>Tài khoản của tôi
            </a></li>
            <li><a class="dropdown-item" href="/orders/my/">
                <i class="fas fa-box me-2"></i>Đơn hàng
            </a></li>
            <li><a class="dropdown-item" href="/addresses/">
                <i class="fas fa-map-marker-alt me-2"></i>Địa chỉ giao hàng
            </a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#" onclick="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
            </a></li>
        `;
        
        // Load cart count
        loadCartCount();
    } else {
        // Not logged in
        document.getElementById('top-auth-links').innerHTML = `
            <a href="/login/" class="text-white">
                <small class="text-white mx-2">Đăng nhập</small>/
            </a>
            <a href="/register/" class="text-white">
                <small class="text-white ms-2">Đăng ký</small>
            </a>
        `;
        
        // Hide cart link
        document.getElementById('cart-link').style.display = 'none';
        
        // Update user dropdown menu
        document.getElementById('user-menu').innerHTML = `
            <li><a class="dropdown-item" href="/login/">Đăng nhập</a></li>
            <li><a class="dropdown-item" href="/register/">Đăng ký</a></li>
        `;
    }
}

function logout() {
    const token = localStorage.getItem('token');
    
    if (confirm('Bạn có chắc muốn đăng xuất?')) {
        fetch('/api/accounts/logout/', {
            method: 'POST',
            headers: {
                'Authorization': 'Token ' + token
            }
        }).then(() => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }).catch(() => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        });
    }
}

function loadCartCount() {
    const token = localStorage.getItem('token');
    if (!token) return;
    
    fetch('/api/cart/me/', {
        headers: {
            'Authorization': 'Token ' + token
        }
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('cart-count').textContent = data.total_items || 0;
    })
    .catch(err => console.error('Error loading cart:', err));
}

// Initialize navbar on page load
document.addEventListener('DOMContentLoaded', updateNavbar);
</script>
