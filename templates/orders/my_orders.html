{% extends 'base.html' %}
{% load static %}

{% block title %}Đơn hàng của tôi - CleanAgri{% endblock %}

{% block content %}
<div class="container-fluid page-header py-5">
    <h1 class="text-center text-white display-6">Đơn hàng của tôi</h1>
    <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="{% url 'home' %}">Trang chủ</a></li>
        <li class="breadcrumb-item active text-white">Đơn hàng</li>
    </ol>
</div>

<div class="container py-5">
    <div class="row">
        <!-- Filter tabs -->
        <div class="col-12 mb-4">
            <ul class="nav nav-pills justify-content-center">
                <li class="nav-item">
                    <a class="nav-link active" href="#" onclick="filterOrders('all'); return false;">Tất cả</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="filterOrders('new'); return false;">Chờ xác nhận</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="filterOrders('paid'); return false;">Đã xác nhận</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="filterOrders('ship'); return false;">Đang giao</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="filterOrders('done'); return false;">Hoàn thành</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="filterOrders('cancel'); return false;">Đã hủy</a>
                </li>
            </ul>
        </div>

        <!-- Orders list -->
        <div class="col-12">
            <div id="orders-container">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentFilter = 'all';

function filterOrders(status) {
    currentFilter = status;
    
    // Update active tab
    document.querySelectorAll('.nav-pills .nav-link').forEach(link => {
        link.classList.remove('active');
    });
    event.target.classList.add('active');
    
    loadOrders();
}

function checkToken() {
    const token = localStorage.getItem('token');
    if (!token) {
        console.warn('Token không tồn tại - Redirect to login');
        window.location.href = '/login/';
        return false;
    }
    return true;
}

function loadOrders() {
    // ✅ KIỂM TRA TOKEN TRƯỚC
    if (!checkToken()) return;
    
    const token = localStorage.getItem('token');
    
    // ✅ BUILD URL ĐÚNG
    let url = '/api/orders/my/';
    if (currentFilter !== 'all') {
        url += `?status=${currentFilter}`;
    }
    
    console.log('🔄 Fetching orders from:', url);
    
    fetch(url, {
        method: 'GET',
        headers: {
            'Authorization': 'Token ' + token,
            'Content-Type': 'application/json'
        }
    })
    .then(res => {
        console.log('📊 Response status:', res.status);
        
        if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        return res.json();
    })
    .then(data => {
        console.log('✅ Data received:', data);
        
        const container = document.getElementById('orders-container');
        
        // ✅ KIỂM TRA DATA CÓ ĐÚNG CẤU TRÚC
        if (!data || !data.orders) {
            console.warn('⚠️ Invalid data structure:', data);
            throw new Error('Dữ liệu không hợp lệ');
        }
        
        // ✅ HIỂN THỊ DANH SÁCH ĐƠN HÀNG
        if (data.orders && data.orders.length > 0) {
            container.innerHTML = data.orders.map(order => `
                <div class="bg-light rounded p-4 mb-4 shadow-sm">
                    <div class="row">
                        <div class="col-md-8">
                            <h5 class="mb-3">📦 Đơn hàng #${order.order_id}</h5>
                            <p class="mb-2">
                                <strong>📅 Ngày đặt:</strong> ${formatDate(order.created_at)}
                            </p>
                            <p class="mb-2">
                                <strong>📊 Trạng thái:</strong> 
                                <span class="badge ${getStatusBadgeClass(order.status)}">
                                    ${order.status_display}
                                </span>
                            </p>
                            <p class="mb-2">
                                <strong>💰 Tổng tiền:</strong> 
                                <span class="text-primary fw-bold">${formatPrice(order.total_vnd)}</span>
                            </p>
                            <p class="mb-0">
                                <strong>🛍️ Sản phẩm:</strong> ${order.items_count} sản phẩm
                            </p>
                        </div>
                        <div class="col-md-4 text-end d-flex flex-column justify-content-center gap-2">
                            <a href="/orders/${order.order_id}/" class="btn btn-primary rounded-pill px-4 py-2">
                                👁️ Xem chi tiết
                            </a>
                            ${(order.status === 'new' || order.status === 'wait') ? `
                                <button onclick="cancelOrder(${order.order_id})" class="btn btn-outline-danger rounded-pill px-4 py-2">
                                    ❌ Hủy đơn
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        } else {
            // ✅ TRƯỜNG HỢP KHÔNG CÓ ĐƠN HÀNG
            container.innerHTML = `
                <div class="text-center py-5">
                    <i class="fas fa-box-open fa-5x text-muted mb-3"></i>
                    <p class="fs-5">📭 Chưa có đơn hàng nào</p>
                    <a href="/shop/" class="btn btn-primary rounded-pill px-4 py-2 mt-3">🛒 Mua sắm ngay</a>
                </div>
            `;
        }
    })
    .catch(err => {
        console.error('❌ Error loading orders:', err);
        const container = document.getElementById('orders-container');
        container.innerHTML = `
            <div class="alert alert-danger shadow-sm">
                <h5>⚠️ Lỗi tải danh sách đơn hàng</h5>
                <p><strong>Chi tiết:</strong> ${err.message}</p>
                <p class="text-muted mb-0">Vui lòng kiểm tra console (F12) hoặc thử lại</p>
            </div>
            <div class="text-center mt-3">
                <button class="btn btn-primary" onclick="loadOrders()">🔄 Thử lại</button>
            </div>
        `;
    });
}

function cancelOrder(orderId) {
    if (!confirm('Bạn có chắc muốn hủy đơn hàng #' + orderId + ' này?')) return;
    
    if (!checkToken()) return;
    
    const token = localStorage.getItem('token');
    
    console.log('🚫 Canceling order:', orderId);
    
    fetch(`/api/orders/${orderId}/cancel/`, {
        method: 'POST',
        headers: {
            'Authorization': 'Token ' + token,
            'Content-Type': 'application/json'
        }
    })
    .then(res => {
        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }
        return res.json();
    })
    .then(data => {
        alert(data.detail || '✅ Đã hủy đơn hàng');
        console.log('✅ Order cancelled successfully');
        loadOrders();  // ✅ RELOAD DANH SÁCH SAU KHI HỦY
    })
    .catch(err => {
        console.error('❌ Cancel error:', err);
        alert('❌ Không thể hủy đơn hàng: ' + err.message);
    });
}

function getStatusBadgeClass(status) {
    const classes = {
        'new': 'bg-secondary',
        'wait': 'bg-warning text-dark',
        'paid': 'bg-info',
        'ship': 'bg-primary',
        'done': 'bg-success',
        'cancel': 'bg-danger'
    };
    return classes[status] || 'bg-secondary';
}

function formatPrice(price) {
    return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
}

function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('vi-VN', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    });
}

// ✅ KHỞI TẠO LOAD ORDERS
console.log('📄 Page loaded, initializing orders...');
document.addEventListener('DOMContentLoaded', function() {
    console.log('✅ DOMContentLoaded fired');
    loadOrders();
});

// ✅ LỰA CHỌN: GỌI NGAY NẾU SCRIPT CHẠY SAU KHI DOM READY
if (document.readyState !== 'loading') {
    console.log('📄 Document already loaded, calling loadOrders immediately');
}
</script>
{% endblock %}
