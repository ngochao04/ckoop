{% extends 'base.html' %}
{% load static %}

{% block title %}Đơn hàng của tôi - CleanAgri{% endblock %}

{% block content %}
<div class="container-fluid page-header py-5">
    <h1 class="text-center text-white display-6">Đơn hàng của tôi</h1>
    <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="{% url 'home' %}">Trang chủ</a></li>
        <li class="breadcrumb-item active text-white">Đơn hàng</li>
    </ol>
</div>

<div class="container py-5">
    <div class="row">
        <!-- Filter tabs -->
        <div class="col-12 mb-4">
            <ul class="nav nav-pills justify-content-center">
                <li class="nav-item">
                    <a class="nav-link active" href="#" onclick="filterOrders('all'); return false;">Tất cả</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="filterOrders('new'); return false;">Chờ xác nhận</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="filterOrders('paid'); return false;">Đã xác nhận</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="filterOrders('ship'); return false;">Đang giao</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="filterOrders('done'); return false;">Hoàn thành</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="filterOrders('cancel'); return false;">Đã hủy</a>
                </li>
            </ul>
        </div>

        <!-- Orders list -->
        <div class="col-12">
            <div id="orders-container">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentFilter = 'all';

function filterOrders(status) {
    currentFilter = status;
    
    // Update active tab
    document.querySelectorAll('.nav-pills .nav-link').forEach(link => {
        link.classList.remove('active');
    });
    event.target.classList.add('active');
    
    loadOrders();
}

function loadOrders() {
    const token = localStorage.getItem('token');
    
    if (!token) {
        window.location.href = '/login/';
        return;
    }
    
    let url = '/api/orders/my/';
    if (currentFilter !== 'all') {
        url += `?status=${currentFilter}`;
    }
    
    fetch(url, {
        headers: {
            'Authorization': 'Token ' + token
        }
    })
    .then(res => res.json())
    .then(data => {
        const container = document.getElementById('orders-container');
        
        if (data.orders && data.orders.length > 0) {
            container.innerHTML = data.orders.map(order => `
                <div class="bg-light rounded p-4 mb-4">
                    <div class="row">
                        <div class="col-md-8">
                            <h5 class="mb-3">Đơn hàng #${order.order_id}</h5>
                            <p class="mb-2">
                                <strong>Ngày đặt:</strong> ${formatDate(order.created_at)}
                            </p>
                            <p class="mb-2">
                                <strong>Trạng thái:</strong> 
                                <span class="badge ${getStatusBadgeClass(order.status)}">
                                    ${order.status_display}
                                </span>
                            </p>
                            <p class="mb-2">
                                <strong>Tổng tiền:</strong> 
                                <span class="text-primary fw-bold">${formatPrice(order.total_vnd)}</span>
                            </p>
                            <p class="mb-0">
                                <strong>Sản phẩm:</strong> ${order.items_count} sản phẩm
                            </p>
                        </div>
                        <div class="col-md-4 text-end d-flex flex-column justify-content-center">
                            <a href="/orders/${order.order_id}/" class="btn btn-primary rounded-pill px-4 py-2 mb-2">
                                Xem chi tiết
                            </a>
                            ${(order.status === 'new' || order.status === 'wait') ? `
                                <button onclick="cancelOrder(${order.order_id})" class="btn btn-outline-danger rounded-pill px-4 py-2">
                                    Hủy đơn
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        } else {
            container.innerHTML = `
                <div class="text-center py-5">
                    <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                    <p>Chưa có đơn hàng nào</p>
                    <a href="/shop/" class="btn btn-primary rounded-pill px-4 py-2">Mua sắm ngay</a>
                </div>
            `;
        }
    })
    .catch(err => {
        console.error('Error:', err);
        document.getElementById('orders-container').innerHTML = `
            <div class="text-center py-5">
                <p class="text-danger">Không thể tải danh sách đơn hàng</p>
                <button class="btn btn-primary" onclick="loadOrders()">Thử lại</button>
            </div>
        `;
    });
}

function cancelOrder(orderId) {
    if (!confirm('Bạn có chắc muốn hủy đơn hàng này?')) return;
    
    const token = localStorage.getItem('token');
    
    fetch(`/api/orders/${orderId}/cancel/`, {
        method: 'POST',
        headers: {
            'Authorization': 'Token ' + token
        }
    })
    .then(res => res.json())
    .then(data => {
        alert(data.detail || 'Đã hủy đơn hàng');
        loadOrders();
    })
    .catch(err => {
        console.error('Error:', err);
        alert('Không thể hủy đơn hàng');
    });
}

function getStatusText(status) {
    const statuses = {
        'new': 'Mới tạo',
        'wait': 'Chờ xác nhận',
        'paid': 'Đã xác nhận',
        'ship': 'Đang giao hàng',
        'done': 'Hoàn thành',
        'cancel': 'Đã hủy'
    };
    return statuses[status] || status;
}

function getStatusBadgeClass(status) {
    const classes = {
        'new': 'bg-secondary',
        'wait': 'bg-warning',
        'paid': 'bg-info',
        'ship': 'bg-primary',
        'done': 'bg-success',
        'cancel': 'bg-danger'
    };
    return classes[status] || 'bg-secondary';
}

function formatPrice(price) {
    return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
}

function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('vi-VN', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    });
}

// Load orders on page load
loadOrders();
</script>
{% endblock %}
